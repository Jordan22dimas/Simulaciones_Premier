name: Actualizar predicciones y web

on:
  schedule:
    - cron: '0 7 * * *'      # todos los días a las 07:00 UTC
  workflow_dispatch:          # botón "Run workflow" manual

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install pandas numpy scipy scikit-learn xgboost joblib requests

      - name: Ejecutar pipeline (descarga → features → modelo → simulación → web)
        run: python code/Pipeline.py

      - name: Publicar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add Data/ Predicciones/ docs/
          git diff --staged --quiet || git commit -m "Actualización automática $(date -u +'%Y-%m-%d')"
          git push
